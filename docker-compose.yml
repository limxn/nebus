services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nebus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nebus}
      POSTGRES_DB: ${POSTGRES_DB:-nebus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nebus} -d ${POSTGRES_DB:-nebus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "55432:5432"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5672:5672"
      - "15672:15672"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nebus:nebus@postgres:5432/nebus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nebus:nebus@postgres:5432/nebus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["faststream", "run", "app.infrastructure.messaging.consumer:app"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nebus:nebus@postgres:5432/nebus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  outbox_relay:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.infrastructure.outbox.relay"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nebus:nebus@postgres:5432/nebus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  postgres_data:
  rabbitmq_data:
