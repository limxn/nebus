[project]
name = "nebus"
version = "0.1.0"
description = "Async payment processing service (FastAPI + RabbitMQ + Outbox pattern)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "faststream[cli,rabbit]>=0.5.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,rabbitmq]>=4.8.0",
    "types-python-dateutil>=2.9.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "N", "SIM", "C4",
    "ASYNC", "DTZ", "T20", "PGH", "RUF", "TID", "LOG",
    "ISC", "INP", "G", "RET", "PERF", "FURB", "FLY",
    "PT", "A", "SLF", "S", "ARG",
    "PLE1142", "PLE1700",
]
ignore = ["B008", "A002", "S101", "S311", "PLR2004", "FURB157"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",
    "SIM117",
    "SLF001",
    "ARG001",
    "ARG002",
    "PLC0415",
    "PT011",
    "PT022",
]
"migrations/**" = ["E", "F", "UP", "B", "N", "RUF100"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = "faststream.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires postgres/rabbitmq containers",
    "e2e: end-to-end API tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["migrations/*"]
